      <rect x="22" y="22" width="476" height="54" rx="10" fill="#15191e"/>
      <text x="44" y="55" fill="#d7d9dc" font-size="15" font-weight="700" letter-spacing="2">SPECIMEN // T-VIRUS</text>
      <circle cx="175" cy="203" r="92" fill="#24090c" stroke="#64141a" stroke-width="2"/>
      <circle cx="175" cy="203" r="57" fill="#5a0f16" opacity=".52"/>
      <g stroke="#ed2430" stroke-width="5" stroke-linecap="round" opacity=".88">
        <path d="M175 102v42M175 262v42M74 203h42M234 203h42M104 132l30 30M216 244l30 30M246 132l-30 30M134 244l-30 30"/>
      </g>
      <text x="304" y="142" fill="#7e858e" font-size="12" letter-spacing="2">STATUS</text><text x="304" y="168" fill="#f2f2f2" font-size="18" font-weight="700">ACTIVE SAMPLE</text>
      <text x="304" y="212" fill="#7e858e" font-size="12" letter-spacing="2">CLASS</text><text x="304" y="238" fill="#f2f2f2" font-size="18" font-weight="700">RNA MUTAGEN</text>
      <text x="304" y="282" fill="#7e858e" font-size="12" letter-spacing="2">RISK INDEX</text>
      <rect x="304" y="298" width="154" height="8" rx="4" fill="#23272d"/><rect x="304" y="298" width="129" height="8" rx="4" fill="url(#red)"/>
      <text x="44" y="342" fill="#b2b6bc" font-size="13">Raccoon City / 1998 / Umbrella-linked archive</text>
    </g>

    <g transform="translate(648 340)">
