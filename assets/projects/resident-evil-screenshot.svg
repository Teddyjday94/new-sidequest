<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 863" role="img" aria-labelledby="t d">
  <title id="t">Biohazard archive research interface preview</title>
  <desc id="d">A dark red and charcoal classified research dashboard with pathogen records, specimen panels, organization files, and incident data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07090b"/><stop offset=".58" stop-color="#0b0d10"/><stop offset="1" stop-color="#130708"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8f1015"/><stop offset="1" stop-color="#e01e28"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#e31d2b" stop-opacity=".28"/><stop offset="1" stop-color="#e31d2b" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity=".035" stroke-width="1"/></pattern>
  </defs>
  <rect width="1680" height="863" fill="url(#bg)"/>
  <rect width="1680" height="863" fill="url(#grid)"/>
  <circle cx="1190" cy="420" r="330" fill="url(#glow)" filter="url(#blur)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="82" y="66" width="1516" height="72" rx="14" fill="#0e1115" stroke="#2a2e34"/>
    <circle cx="126" cy="102" r="20" fill="#a51018"/>
    <path d="M126 84v36M108 102h36M113 89l26 26M139 89l-26 26" stroke="#f0d9d9" stroke-width="3" opacity=".88"/>
    <text x="162" y="96" fill="#f2f2f2" font-size="18" font-weight="700" letter-spacing="3">BIOHAZARD RESEARCH ARCHIVE</text>
    <text x="162" y="117" fill="#737881" font-size="12" letter-spacing="2">CLASSIFIED // INTERNAL ACCESS</text>
    <g fill="#777d86" font-size="13" letter-spacing="1.5"><text x="1130" y="106">INCIDENTS</text><text x="1250" y="106">PATHOGENS</text><text x="1385" y="106">DOSSIERS</text><text x="1500" y="106">ARMORY</text></g>

    <text x="92" y="205" fill="#d41b24" font-size="14" font-weight="700" letter-spacing="4">PATHOGEN RESEARCH / ACTIVE FILES</text>
    <text x="92" y="250" fill="#f4f4f4" font-size="52" font-weight="800">Recovered specimen records</text>
    <text x="94" y="284" fill="#8b919a" font-size="17">Cross-reference outbreak data, viral samples, organizations, and field reports.</text>

    <g transform="translate(92 340)">
