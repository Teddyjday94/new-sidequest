      <text x="26" y="44" fill="#d41b24" font-size="12" font-weight="700" letter-spacing="3">INCIDENT DATABASE</text>
      <text x="26" y="76" fill="#f1f1f1" font-size="25" font-weight="700">Raccoon City</text>
      <g transform="translate(26 104)">
        <rect width="380" height="74" rx="12" fill="#15191e"/><text x="18" y="26" fill="#7d838b" font-size="11" letter-spacing="2">OUTBREAK</text><text x="18" y="52" fill="#e6e6e6" font-size="16" font-weight="700">September 1998</text><text x="292" y="44" fill="#d41b24" font-size="24" font-weight="800">09.28</text>
        <rect y="88" width="380" height="74" rx="12" fill="#15191e"/><text x="18" y="114" fill="#7d838b" font-size="11" letter-spacing="2">FACILITY</text><text x="18" y="140" fill="#e6e6e6" font-size="16" font-weight="700">NEST / Underground</text><circle cx="338" cy="125" r="14" fill="#631218"/><circle cx="338" cy="125" r="5" fill="#e31d2b"/>
        <rect y="176" width="380" height="74" rx="12" fill="#15191e"/><text x="18" y="202" fill="#7d838b" font-size="11" letter-spacing="2">ORGANIZATION</text><text x="18" y="228" fill="#e6e6e6" font-size="16" font-weight="700">Umbrella Corporation</text><path d="M326 198h24l12 12-12 12h-24l-12-12z" fill="#9f141b"/>
      </g>
    </g>

    <g transform="translate(1116 340)">
