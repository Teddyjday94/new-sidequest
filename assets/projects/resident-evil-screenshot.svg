      <text x="26" y="44" fill="#d41b24" font-size="12" font-weight="700" letter-spacing="3">FIELD DOSSIERS</text>
      <g transform="translate(26 72)">
        <rect width="205" height="114" rx="14" fill="#161a1f"/><rect x="16" y="16" width="64" height="82" rx="8" fill="#23282f"/><path d="M29 83c8-23 43-23 51 0" fill="#4d545d"/><circle cx="55" cy="45" r="18" fill="#4d545d"/><text x="96" y="38" fill="#f1f1f1" font-size="15" font-weight="700">LEON S. K.</text><text x="96" y="61" fill="#818891" font-size="11">R.P.D.</text><text x="96" y="86" fill="#d41b24" font-size="11" font-weight="700">SURVIVOR FILE</text>
        <rect x="225" width="205" height="114" rx="14" fill="#161a1f"/><rect x="241" y="16" width="64" height="82" rx="8" fill="#23282f"/><path d="M254 83c8-23 43-23 51 0" fill="#4d545d"/><circle cx="280" cy="45" r="18" fill="#4d545d"/><text x="321" y="38" fill="#f1f1f1" font-size="15" font-weight="700">JILL V.</text><text x="321" y="61" fill="#818891" font-size="11">S.T.A.R.S.</text><text x="321" y="86" fill="#d41b24" font-size="11" font-weight="700">OPERATIVE</text>
        <rect y="134" width="430" height="130" rx="14" fill="#161a1f"/>
        <text x="18" y="164" fill="#7d838b" font-size="11" letter-spacing="2">ARMORY ARCHIVE</text>
        <g transform="translate(18 184)"><rect width="118" height="56" rx="9" fill="#20252b"/><path d="M20 26h56l18 8-18 8H44l-9 8H20z" fill="#737b84"/><rect x="154" width="118" height="56" rx="9" fill="#20252b"/><path d="M170 18h46v12h24v9h-24v12h-46z" fill="#737b84"/><rect x="308" width="104" height="56" rx="9" fill="#20252b"/><circle cx="347" cy="28" r="15" fill="none" stroke="#737b84" stroke-width="6"/></g>
      </g>
    </g>

    <rect x="92" y="742" width="1506" height="54" rx="12" fill="#0d1014" stroke="#24282e"/>
    <text x="116" y="775" fill="#6f7680" font-size="12" letter-spacing="2">ARCHIVE STATUS</text><circle cx="254" cy="770" r="6" fill="#d41b24"/><text x="270" y="775" fill="#bfc3c8" font-size="12" letter-spacing="1.5">LIVE // 28 INCIDENTS // 12 ORGANIZATIONS // 09 PATHOGENS</text>
    <text x="1374" y="775" fill="#6f7680" font-size="12" letter-spacing="2">ACCESS LEVEL 04</text>
  </g>
</svg>
